<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDD - Lista de Consumíveis - Som Direto</title>
  <style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #171a1f;
  --panel: rgba(21, 24, 30, 0.88);
  --text: #f8f3d8;
  --muted: rgba(248, 243, 216, 0.56);
  --line: rgba(143, 229, 255, 0.18);
  --blue: #8fe5ff;
  --blue-soft: rgba(143, 229, 255, 0.12);
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 74% 18%, rgba(143, 229, 255, 0.14), transparent 28%),
    radial-gradient(circle at 28% 78%, rgba(248, 243, 216, 0.08), transparent 26%),
    var(--bg);
}

.page {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 16px;
}

.panel {
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--panel);
  padding: 26px;
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.28);
}

header {
  margin-bottom: 26px;
}

.kicker {
  margin: 0 0 8px;
  color: var(--blue);
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(34px, 8vw, 58px);
  line-height: 0.96;
  letter-spacing: -0.06em;
}

.sub {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 17px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}

.topbar strong {
  color: var(--blue);
  font-size: 20px;
}

.topbar span {
  margin-left: 6px;
  color: var(--muted);
  font-size: 14px;
}

.buttons {
  display: flex;
  gap: 8px;
}

button {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 13px;
  background: transparent;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
}

button:hover {
  border-color: var(--blue);
  background: var(--blue-soft);
}

.line {
  height: 2px;
  overflow: hidden;
  margin-bottom: 18px;
  border-radius: 999px;
  background: rgba(248, 243, 216, 0.12);
}

.line span {
  display: block;
  width: 0%;
  height: 100%;
  background: var(--blue);
  transition: width 0.2s ease;
}

input[type="search"] {
  width: 100%;
  margin-bottom: 14px;
  padding: 13px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  font-size: 15px;
  outline: none;
}

input[type="search"]::placeholder {
  color: var(--muted);
}

input[type="search"]:focus {
  border-color: var(--blue);
}

.list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.item {
  border-bottom: 1px solid rgba(143, 229, 255, 0.10);
}

.item:last-child {
  border-bottom: 0;
}

.item label {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 12px;
  align-items: center;
  min-height: 54px;
  cursor: pointer;
}

.item input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.box {
  width: 18px;
  height: 18px;
  border: 1px solid var(--line);
  border-radius: 5px;
}

.item input:checked + .box {
  border-color: var(--blue);
  background: var(--blue);
  box-shadow: 0 0 18px rgba(143, 229, 255, 0.28);
}

.item input:checked + .box::after {
  content: "";
  display: block;
  width: 8px;
  height: 4px;
  margin: 5px 0 0 4px;
  border-left: 2px solid #171a1f;
  border-bottom: 2px solid #171a1f;
  transform: rotate(-45deg);
}

.name {
  font-size: 15px;
}

.qty {
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
}

.item:has(input:checked) .name {
  color: var(--muted);
  text-decoration: line-through;
}

.hidden {
  display: none;
}

@media (max-width: 560px) {
  .page {
    padding: 14px;
  }

  .panel {
    padding: 20px;
    border-radius: 18px;
  }

  .topbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .item label {
    grid-template-columns: 22px 1fr;
    gap: 10px;
    padding: 10px 0;
  }

  .qty {
    grid-column: 2;
  }
}

</style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <header>
        <p class="kicker">EDD</p>
        <h1>Lista de Consumíveis</h1>
        <p class="sub">Som Direto</p>
      </header>

      <div class="topbar">
        <div>
          <strong id="progressText">0/14</strong>
          <span>itens marcados</span>
        </div>
        <div class="buttons">
          <button id="markAllBtn" type="button">marcar</button>
          <button id="clearBtn" type="button">limpar</button>
        </div>
      </div>

      <div class="line">
        <span id="progressFill"></span>
      </div>

      <input id="searchInput" type="search" placeholder="buscar item" aria-label="Buscar item" />

      <ul id="checklist" class="list">
        <li class="item" data-product="fita gaffer preta">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Fita gaffer preta</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="fita crepe">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Fita crepe</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="fita dupla face">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Fita dupla face</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="transpore / micropore">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Transpore / Micropore</span>
            <span class="qty">2 rolos</span>
          </label>
        </li>
        <li class="item" data-product="feltro moleskin / espuma fina">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Feltro Moleskin / espuma fina</span>
            <span class="qty">1 folha</span>
          </label>
        </li>
        <li class="item" data-product="nexcare">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Nexcare</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="pilhas aa alcalinas duracell">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Pilhas AA alcalinas DURACELL</span>
            <span class="qty">20 unidades</span>
          </label>
        </li>
        <li class="item" data-product="pilhas aaa">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Pilhas AAA</span>
            <span class="qty">4 unidades</span>
          </label>
        </li>
        <li class="item" data-product="etiquetas adesivas (qualquer tamanho)">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Etiquetas adesivas (qualquer tamanho)</span>
            <span class="qty">1 pacote</span>
          </label>
        </li>
        <li class="item" data-product="velcro adesivo">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Velcro adesivo</span>
            <span class="qty">1 pacote ou 1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="abraçadeiras de nylon / enforca-gato">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Abraçadeiras de nylon / enforca-gato</span>
            <span class="qty">1 pacote</span>
          </label>
        </li>
        <li class="item" data-product="álcool isopropílico">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Álcool isopropílico</span>
            <span class="qty">1 frasco</span>
          </label>
        </li>
        <li class="item" data-product="paninho de limpeza (perfex)">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Paninho de limpeza (Perfex)</span>
            <span class="qty">2 a 4 unidades</span>
          </label>
        </li>
        <li class="item" data-product="fita isolante preta">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Fita isolante preta</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
      </ul>
    </section>
  </main>

  <script>
const checkboxes = Array.from(document.querySelectorAll('input[type="checkbox"]'));
const progressText = document.querySelector("#progressText");
const progressFill = document.querySelector("#progressFill");
const clearBtn = document.querySelector("#clearBtn");
const markAllBtn = document.querySelector("#markAllBtn");
const searchInput = document.querySelector("#searchInput");
const checklist = document.querySelector("#checklist");

const storageKey = "edd-consumiveis-minimal";

function loadState() {
  const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
  checkboxes.forEach((checkbox, index) => {
    checkbox.checked = saved.includes(index);
  });
  updateProgress();
}

function saveState() {
  const checkedIndexes = checkboxes
    .map((checkbox, index) => checkbox.checked ? index : null)
    .filter(index => index !== null);

  localStorage.setItem(storageKey, JSON.stringify(checkedIndexes));
}

function updateProgress() {
  const total = checkboxes.length;
  const checked = checkboxes.filter(checkbox => checkbox.checked).length;
  const percentage = total ? Math.round((checked / total) * 100) : 0;

  progressText.textContent = `${checked}/${total}`;
  progressFill.style.width = `${percentage}%`;
}

checkboxes.forEach(checkbox => {
  checkbox.addEventListener("change", () => {
    saveState();
    updateProgress();
  });
});

clearBtn.addEventListener("click", () => {
  checkboxes.forEach(checkbox => checkbox.checked = false);
  saveState();
  updateProgress();
});

markAllBtn.addEventListener("click", () => {
  checkboxes.forEach(checkbox => checkbox.checked = true);
  saveState();
  updateProgress();
});

searchInput.addEventListener("input", () => {
  const term = searchInput.value.trim().toLowerCase();
  Array.from(checklist.querySelectorAll(".item")).forEach(item => {
    item.classList.toggle("hidden", !item.dataset.product.includes(term));
  });
});

loadState();

</script>
</body>
</html>
