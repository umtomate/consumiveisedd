<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDD - Lista de Consumíveis - Som Direto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="panel">
      <header>
        <p class="kicker">EDD</p>
        <h1>Lista de Consumíveis</h1>
        <p class="sub">Som Direto</p>
      </header>

      <div class="topbar">
        <div>
          <strong id="progressText">0/14</strong>
          <span>itens marcados</span>
        </div>
        <div class="buttons">
          <button id="markAllBtn" type="button">marcar</button>
          <button id="clearBtn" type="button">limpar</button>
        </div>
      </div>

      <div class="line">
        <span id="progressFill"></span>
      </div>

      <input id="searchInput" type="search" placeholder="buscar item" aria-label="Buscar item" />

      <ul id="checklist" class="list">
        <li class="item" data-product="fita gaffer preta">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Fita gaffer preta</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="fita crepe">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Fita crepe</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="fita dupla face">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Fita dupla face</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="transpore / micropore">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Transpore / Micropore</span>
            <span class="qty">2 rolos</span>
          </label>
        </li>
        <li class="item" data-product="feltro moleskin / espuma fina">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Feltro Moleskin / espuma fina</span>
            <span class="qty">1 folha</span>
          </label>
        </li>
        <li class="item" data-product="nexcare">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Nexcare</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="pilhas aa alcalinas duracell">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Pilhas AA alcalinas DURACELL</span>
            <span class="qty">20 unidades</span>
          </label>
        </li>
        <li class="item" data-product="pilhas aaa">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Pilhas AAA</span>
            <span class="qty">4 unidades</span>
          </label>
        </li>
        <li class="item" data-product="etiquetas adesivas (qualquer tamanho)">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Etiquetas adesivas (qualquer tamanho)</span>
            <span class="qty">1 pacote</span>
          </label>
        </li>
        <li class="item" data-product="velcro adesivo">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Velcro adesivo</span>
            <span class="qty">1 pacote ou 1 rolo</span>
          </label>
        </li>
        <li class="item" data-product="abraçadeiras de nylon / enforca-gato">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Abraçadeiras de nylon / enforca-gato</span>
            <span class="qty">1 pacote</span>
          </label>
        </li>
        <li class="item" data-product="álcool isopropílico">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Álcool isopropílico</span>
            <span class="qty">1 frasco</span>
          </label>
        </li>
        <li class="item" data-product="paninho de limpeza (perfex)">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Paninho de limpeza (Perfex)</span>
            <span class="qty">2 a 4 unidades</span>
          </label>
        </li>
        <li class="item" data-product="fita isolante preta">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Fita isolante preta</span>
            <span class="qty">1 rolo</span>
          </label>
        </li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
